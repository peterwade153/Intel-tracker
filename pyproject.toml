[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Intel-tracker"
version = "0.1.0"
description = "Automated AI lab and ecosystem release tracker"
requires-python = ">=3.12"
dependencies = [
    "apache-airflow>=3.4.0,<4.0.0",
    "apache-airflow-providers-postgres",
    "httpx>=0.28.0",
    "feedparser>=6.0.11",
    "trafilatura>=1.12.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.6",
    "pydantic>=2.9.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["tracker"]

[tool.ruff]
line-length = 100
target-version = "py311"
